<div class="col-6 col-xl-3">
	<article class="rating-card">
		<img
			class="rating-card__logo@@if (typeof logo_mod !== 'undefined' && logo_mod) { @@logo_mod}"
			src="@@logo"
			alt="@@alt"
			width="@@width"
			height="@@height"
			loading="lazy"
		>
		<div class="rating-card__score icon-star">
			<span>@@score</span>
		</div>
		<p class="rating-card__count">@@count</p>
	</article>
</div>
