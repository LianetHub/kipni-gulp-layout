<div class="col-6 col-xl-3">
	<div class="rating-card">
		<!-- fileinclude -->
		<img
			class="rating-card__logo"
			src="@@logo"
			alt="@@alt"
			width="@@width"
			height="@@height"
			loading="lazy"
			>
		<!-- fileinclude -->
		<div class="rating-card__score icon-star">
			<span>@@score</span>
		</div>
		<p class="rating-card__count">@@count</p>
	</div>
</div>
