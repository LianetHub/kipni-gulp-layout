<article class="promo-card">
	<div class="promo-card__head">
		<p class="promo-card__date">
			<span class="promo-card__date-icon" aria-hidden="true">
				<img src="@img/promotions/calendar.svg" alt="Календарь" width="24" height="24">
			</span>
			<span class="promo-card__date-text">Акция действует до @@until</span>
		</p>
		<span class="promo-card__badge" aria-hidden="true">
			<img src="@img/promotions/gift.svg" alt="Подарок" width="40" height="40">
		</span>
	</div>
	<h3 class="h2 promo-card__title">@@title</h3>
	<p class="text promo-card__text">@@text</p>
	<a class="btn btn--primary promo-card__btn" href="@@link">Подробнее</a>
		<div class="promo-card__media" role="img" aria-label="@@image_alt" style="background-image: url('@@image');"></div>
</article>
