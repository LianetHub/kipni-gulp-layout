<a class="promo-card" href="@@link">
	<div class="promo-card__head">
		<p class="promo-card__date icon-calendar">
			<span class="promo-card__date-text">Акция действует до @@until</span>
		</p>
		<span class="promo-card__badge" aria-hidden="true">
			<img src="@img/shared/ui/gift.svg" alt="Подарок" width="40" height="40" loading="lazy">
		</span>
	</div>
	<h3 class="h2 promo-card__title">@@title</h3>
	<p class="text promo-card__text">@@text</p>
	<img
		class="promo-card__img"
		src="@@image"
		alt="@@image_alt"
		width="@@image_width"
		height="@@image_height"
		loading="lazy"
	>
	<span class="btn btn--primary btn--large promo-card__btn">Подробнее</span>
</a>
