<form class="catalog-filters" aria-labelledby="@@title_id">
	<div class="catalog-filters__head">
		<h2 class="catalog-filters__title" id="@@title_id">Фильтры</h2>
		<button type="button" class="catalog-filters__reset icon-cross">
			Сбросить
		</button>
	</div>

	<div class="catalog-filters__group">
		<h3 class="catalog-filters__group-title">Бренд</h3>
		<div class="catalog-filters__chips">
			<button type="button" class="catalog-chip catalog-chip--brand is-active" aria-pressed="true">KIPNI</button>
			<button type="button" class="catalog-chip catalog-chip--brand" aria-pressed="false">AXIT</button>
			<button type="button" class="catalog-chip catalog-chip--brand" aria-pressed="false">Olly</button>
			<button type="button" class="catalog-chip catalog-chip--brand" aria-pressed="false">Lutea</button>
		</div>
	</div>

	<div class="catalog-filters__group">
		<h3 class="catalog-filters__group-title">Литраж</h3>
		<div class="catalog-filters__chips">
			<button type="button" class="catalog-chip" aria-pressed="false">380 мл</button>
			<button type="button" class="catalog-chip" aria-pressed="false">500 мл</button>
			<button type="button" class="catalog-chip is-active" aria-pressed="true">750 мл</button>
			<button type="button" class="catalog-chip" aria-pressed="false">1 л</button>
			<button type="button" class="catalog-chip" aria-pressed="false">1.5 л</button>
			<button type="button" class="catalog-chip" aria-pressed="false">2.5 л</button>
			<button type="button" class="catalog-chip" aria-pressed="false">5 л</button>
		</div>
	</div>

	<div class="catalog-filters__group">
		<h3 class="catalog-filters__group-title">Тип</h3>
		<div class="catalog-filters__chips">
			<button type="button" class="catalog-chip" aria-pressed="false">Гель для душа</button>
			<button type="button" class="catalog-chip is-active" aria-pressed="true">Шампунь</button>
			<button type="button" class="catalog-chip" aria-pressed="false">Кондиционер для белья</button>
			<button type="button" class="catalog-chip" aria-pressed="false">Средство для мытья пола</button>
			<button type="button" class="catalog-chip" aria-pressed="false">Жидкое мыло</button>
			<button type="button" class="catalog-chip" aria-pressed="false">Мыло</button>
			<button type="button" class="catalog-chip" aria-pressed="false">Средство для мытья посуды</button>
			<button type="button" class="catalog-chip" aria-pressed="false">Мыло хозяйственное жидкое</button>
		</div>
	</div>

	<button type="submit" class="btn btn--primary btn--large catalog-filters__submit">Применить фильтр</button>
</form>
