<article class="blog-card">
	<a href="@@link" class="blog-card__media">
		<!-- fileinclude -->
		<img
			class="cover-image"
			src="@@image"
			alt="@@image_alt"
			width="@@image_width"
			height="@@image_height"
			loading="lazy"
			>
		<!-- fileinclude -->
	</a>
	<div class="blog-card__body">
		<ul class="blog-card__meta">
			<li class="blog-card__meta-item icon-eye">
				<span class="blog-card__meta-text">@@views</span>
			</li>
			<li class="blog-card__meta-item icon-calendar">
				<span class="blog-card__meta-text">@@date</span>
			</li>
			<li class="blog-card__meta-item icon-heart-fill">
				<span class="blog-card__meta-text">@@likes</span>
			</li>
		</ul>
		<h2 class="h2 blog-card__title">
			<a href="@@link" class="blog-card__title-link">@@title</a>
		</h2>
		<p class="text blog-card__text">@@text</p>
		<a class="btn btn--primary btn--large blog-card__btn icon-chevron-right" href="@@link">
			Читать далее
		</a>
	</div>
</article>
