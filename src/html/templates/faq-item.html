<div class="faq__item">
	<button class="faq__question icon-plus" type="button" aria-expanded="false" aria-controls="faq-answer-@@id" id="faq-question-@@id">
		<span class="faq__question-text">@@question</span>
	</button>
	<div class="faq__answer" id="faq-answer-@@id" role="region" aria-labelledby="faq-question-@@id" hidden>
		<p class="text">@@answer</p>
	</div>
</div>
