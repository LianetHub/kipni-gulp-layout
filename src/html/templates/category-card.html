<div class="col-6 col-xl-4">
	<a
		class="category-card@@if (typeof modifier !== 'undefined' && modifier) { @@modifier}"
		href="@@href"
		aria-label="@@aria_label"
		style="background-image: url('@@image');"
	>
		<div class="category-card__content">
			<h3 class="category-card__title">@@title</h3>
			<p class="category-card__lead">@@lead</p>
			<span class="btn @@btn_mod category-card__btn icon-chevron-right">
				Смотреть все
			</span>
		</div>
	</a>
</div>
