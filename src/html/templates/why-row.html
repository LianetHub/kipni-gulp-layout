<li class="row why__row@@if (typeof reverse !== 'undefined' && reverse) { why__row--reverse}">
	<div class="col-12 col-xl-6">
		<div class="why__media">
			<img src="@@image" class="cover-image" alt="@@alt" width="720" height="350" loading="lazy">
		</div>
	</div>
	<div class="col-12 col-xl-6">
		<div class="why__copy@@if (typeof reverse !== 'undefined' && reverse) { why__copy--end}">
			<h3 class="title-md why__subtitle">@@title</h3>
			<p class="why__text">@@text</p>
		</div>
	</div>
</li>
