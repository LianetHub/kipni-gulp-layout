<div class="col-6 col-md-4">
	<a class="marketplace-card" href="@@href" aria-label="@@aria_label">
		<img
			class="marketplace-card__logo@@if (typeof logo_mod !== 'undefined' && logo_mod) { @@logo_mod}"
			src="@@logo"
			alt="@@alt"
			width="@@width"
			height="@@height"
			loading="lazy"
		>
		<span class="marketplace-card__caption">Перейти в магазин</span>
	</a>
</div>
