<div class="col-6 col-md-4">
	<a class="marketplaces__card" href="@@href" aria-label="@@aria_label">
		<!-- fileinclude -->
			<img
			class="marketplaces__card-logo@@if (typeof logo_mod !== 'undefined' && logo_mod) { @@logo_mod}"
			src="@@logo"
			alt="@@alt"
			width="@@width"
			height="@@height"
			loading="lazy"
			>
		<!-- fileinclude -->
		<span class="marketplaces__card-caption">Перейти в магазин</span>
	</a>
</div>
