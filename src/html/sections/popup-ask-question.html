<div id="modal-ask-question" class="popup">
	<div class="popup__head">
		<h2 class="popup__title">Задать вопрос</h2>
		<p class="text popup__lead">
			Возникли вопросы? Напишите их в форме ниже и мы обязательно ответим Вам в ближайшее время
		</p>
	</div>
	<form class="popup__form" action="#" method="post">
		<div class="row g-3 popup__fields">
			<div class="col-12 col-md-4">
				<label class="visually-hidden" for="ask-name">Имя</label>
				<input class="form-control" id="ask-name" type="text" name="name" placeholder="Введите имя" required autocomplete="name">
			</div>
			<div class="col-12 col-md-4">
				<label class="visually-hidden" for="ask-email">Электронная почта</label>
				<input class="form-control" id="ask-email" type="email" name="email" placeholder="Электронная почта" required autocomplete="email">
			</div>
			<div class="col-12 col-md-4">
				<label class="visually-hidden" for="ask-phone">Номер телефона</label>
				<input class="form-control" id="ask-phone" type="tel" name="phone" placeholder="Номер телефона" required autocomplete="tel">
			</div>
			<div class="col-12">
				<label class="visually-hidden" for="ask-message">Ваш вопрос</label>
				<textarea class="form-control popup__textarea" id="ask-message" name="message" placeholder="Ваш вопрос" required rows="6"></textarea>
			</div>
		</div>

		<label class="popup__consent icon-check">
			<input class="visually-hidden popup__checkbox" type="checkbox" name="consent" required checked>
			<span class="popup__consent-text">
				Нажимая на кнопку, вы даете согласие на обработку&nbsp;персональных данных
			</span>
		</label>

		<button class="btn btn--primary btn--large popup__submit" type="submit">Задать вопрос</button>
	</form>
</div>
