<section class="marketplaces section-space-md" aria-labelledby="marketplaces-title">
	<div class="container">
		<div class="marketplaces__panel">
			<div class="marketplaces__grid">
				<div class="marketplaces__intro">
					<h2 class="marketplaces__title" id="marketplaces-title">
						Выбирайте удобный
						<span class="marketplaces__title-accent">способ покупки</span>
					</h2>
					<p class="marketplaces__lead">Наши товары есть на&nbsp;всех крупнейших маркетплейсах</p>
				</div>
				<div class="marketplaces__shops">
					<a class="marketplace-card marketplace-card--avito" href="#" aria-label="Купить на Avito">
						<img class="marketplace-card__logo" src="@img/shared/logos/marketplaces/avito.svg" alt="Avito" width="160" height="24" loading="lazy">
						<span class="marketplace-card__caption">Перейти в магазин</span>
					</a>
					<a class="marketplace-card" href="#" aria-label="Купить на Ozon">
						<img class="marketplace-card__logo marketplace-card__logo--ozon" src="@img/shared/logos/marketplaces/ozon.svg" alt="Ozon" width="98" height="21" loading="lazy">
					</a>
					<a class="marketplace-card" href="#" aria-label="Купить на Wildberries">
						<img class="marketplace-card__logo marketplace-card__logo--wb" src="@img/shared/logos/marketplaces/wildberries.svg" alt="Wildberries" width="160" height="24" loading="lazy">
					</a>
					<a class="marketplace-card" href="#" aria-label="Купить на Мегамаркете">
						<img class="marketplace-card__logo marketplace-card__logo--mega" src="@img/shared/logos/marketplaces/megamarket.svg" alt="Мегамаркет" width="195" height="29" loading="lazy">
					</a>
					<a class="marketplace-card" href="#" aria-label="Купить на Яндекс Маркете">
						<img class="marketplace-card__logo marketplace-card__logo--yandex" src="@img/shared/logos/marketplaces/yandex-market.png" alt="Яндекс Маркет" width="174" height="26" loading="lazy">
					</a>
					<a class="marketplace-card" href="#" aria-label="Купить на Магнит Маркете">
						<img class="marketplace-card__logo marketplace-card__logo--magnit" src="@img/shared/logos/marketplaces/magnit.png" alt="Магнит Маркет" width="191" height="36" loading="lazy">
					</a>
				</div>
				<div class="marketplaces__perks">
					<div class="marketplace-perk">
						<span class="marketplace-perk__icon icon-truck" aria-hidden="true"></span>
						<span class="marketplace-perk__text">Быстрая доставка</span>
					</div>
					<div class="marketplace-perk">
						<span class="marketplace-perk__icon icon-certificate" aria-hidden="true"></span>
						<span class="marketplace-perk__text">Оригинальная продукция</span>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
