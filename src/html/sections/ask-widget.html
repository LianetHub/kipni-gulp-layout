<aside class="ask-widget" data-ask-widget aria-label="Задать вопрос" aria-hidden="true">
	@@if(typeof fancyboxSrc !== 'undefined' && fancyboxSrc){
	<a class="ask-widget__link" href="@@fancyboxSrc" data-fancybox data-src="@@fancyboxSrc" data-type="inline">
		}
		@@if(typeof fancyboxSrc === 'undefined' || !fancyboxSrc){
		<a class="ask-widget__link" href="#">
			}
			<div class="ask-widget__media" role="img" aria-label="Маскот KIPNI — зелёная птица" style="background-image: url('@img/ask/bird.png');"></div>
			<span class="btn btn--soft ask-widget__btn">Задать вопрос</span>
		</a>
</aside>
