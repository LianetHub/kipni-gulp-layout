<div class="vacancy-modals visually-hidden" aria-hidden="true">
	<div id="modal-vacancy-apply" class="vacancy-modal vacancy-modal--apply">
		<button class="vacancy-modal__close" type="button" data-fancybox-close aria-label="Закрыть">
			<img src="img/vacancies/icon-close.svg" alt="" width="36" height="36" loading="lazy">
		</button>
		<div class="vacancy-modal__head">
			<h2 class="vacancy-modal__title">Откликнуться на вакансию</h2>
			<p class="text vacancy-modal__lead">Оставьте свое резюме и контактные данные в форме</p>
		</div>
		<form class="vacancy-modal__form" action="#" method="post" enctype="multipart/form-data">
			<div class="row g-3 vacancy-modal__fields">
				<div class="col-12 col-md-7">
					<label class="visually-hidden" for="vacancy-apply-name">ФИО</label>
					<input
						class="form-control"
						id="vacancy-apply-name"
						type="text"
						name="name"
						placeholder="Введите ФИО"
						required
						autocomplete="name"
					>
				</div>
				<div class="col-12 col-md-5">
					<label class="visually-hidden" for="vacancy-apply-email">Электронная почта</label>
					<input
						class="form-control"
						id="vacancy-apply-email"
						type="email"
						name="email"
						placeholder="Электронная почта"
						required
						autocomplete="email"
					>
				</div>
				<div class="col-12 col-md-5">
					<label class="visually-hidden" for="vacancy-apply-phone">Номер телефона</label>
					<input
						class="form-control"
						id="vacancy-apply-phone"
						type="tel"
						name="phone"
						placeholder="Номер телефона"
						required
						autocomplete="tel"
					>
				</div>
				<div class="col-12 col-md-7">
					<label class="vacancy-modal__file">
						<input
							class="vacancy-modal__file-input"
							type="file"
							name="resume"
							accept=".pdf,.doc,.docx,.rtf"
							data-vacancy-file
						>
						<span class="vacancy-modal__file-btn">
							<img src="img/vacancies/icon-attach.svg" alt="" width="22" height="25" loading="lazy">
							<span class="vacancy-modal__file-text" data-vacancy-file-label>Прикрепить резюме</span>
						</span>
					</label>
				</div>
			</div>

			<label class="vacancy-modal__consent">
				<input class="vacancy-modal__checkbox" type="checkbox" name="consent" required checked>
				<span class="vacancy-modal__check" aria-hidden="true">
					<img src="img/vacancies/icon-check.svg" alt="" width="20" height="20" loading="lazy">
				</span>
				<span class="vacancy-modal__consent-text">
					Нажимая на кнопку, вы даете согласие на обработку&nbsp;персональных данных
				</span>
			</label>

			<button class="btn btn--primary vacancy-modal__submit" type="submit">Откликнуться</button>
		</form>
	</div>

	<div id="modal-ask-question" class="vacancy-modal vacancy-modal--ask">
		<button class="vacancy-modal__close" type="button" data-fancybox-close aria-label="Закрыть">
			<img src="img/vacancies/icon-close.svg" alt="" width="36" height="36" loading="lazy">
		</button>
		<div class="vacancy-modal__head">
			<h2 class="vacancy-modal__title">Задать вопрос</h2>
			<p class="text vacancy-modal__lead">
				Возникли вопросы? Напишите их в форме ниже и мы обязательно ответим Вам в ближайшее время
			</p>
		</div>
		<form class="vacancy-modal__form" action="#" method="post">
			<div class="row g-3 vacancy-modal__fields">
				<div class="col-12 col-md-4">
					<label class="visually-hidden" for="vacancy-ask-name">Имя</label>
					<input
						class="form-control"
						id="vacancy-ask-name"
						type="text"
						name="name"
						placeholder="Введите имя"
						required
						autocomplete="name"
					>
				</div>
				<div class="col-12 col-md-4">
					<label class="visually-hidden" for="vacancy-ask-email">Электронная почта</label>
					<input
						class="form-control"
						id="vacancy-ask-email"
						type="email"
						name="email"
						placeholder="Электронная почта"
						required
						autocomplete="email"
					>
				</div>
				<div class="col-12 col-md-4">
					<label class="visually-hidden" for="vacancy-ask-phone">Номер телефона</label>
					<input
						class="form-control"
						id="vacancy-ask-phone"
						type="tel"
						name="phone"
						placeholder="Номер телефона"
						required
						autocomplete="tel"
					>
				</div>
				<div class="col-12">
					<label class="visually-hidden" for="vacancy-ask-message">Ваш вопрос</label>
					<textarea
						class="form-control vacancy-modal__textarea"
						id="vacancy-ask-message"
						name="message"
						placeholder="Ваш вопрос"
						required
						rows="6"
					></textarea>
				</div>
			</div>

			<label class="vacancy-modal__consent">
				<input class="vacancy-modal__checkbox" type="checkbox" name="consent" required checked>
				<span class="vacancy-modal__check" aria-hidden="true">
					<img src="img/vacancies/icon-check.svg" alt="" width="20" height="20" loading="lazy">
				</span>
				<span class="vacancy-modal__consent-text">
					Нажимая на кнопку, вы даете согласие на обработку&nbsp;персональных данных
				</span>
			</label>

			<button class="btn btn--primary vacancy-modal__submit" type="submit">Задать вопрос</button>
		</form>
	</div>
</div>
