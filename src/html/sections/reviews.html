<section class="reviews" aria-labelledby="reviews-title">
	<div class="container">
		<div class="row reviews__head gy-4">
			<div class="col-12 col-xl-4 reviews__intro">
				<h2 class="h2 reviews__title" id="reviews-title">
					Нам доверяют
					<span class="reviews__title-accent">тысячи покупателей</span>
				</h2>
				<p class="reviews__lead">Более 100&nbsp;000 отзывов оставленных реальными покупателями</p>
			</div>
			<div class="col-12 col-xl-8">
				<div class="row reviews__ratings gy-3">
					@@loop('../templates/rating-card.html', 'html/json/rating-cards.json')
				</div>
			</div>
		</div>

		<div class="reviews__slider-wrap">
			<div class="swiper reviews__slider">
				<div class="swiper-wrapper">
					@@loop('../templates/review-card.html', 'html/json/review-cards.json')
				</div>
				<div class="reviews__pagination swiper-pagination"></div>
			</div>
			<div class="reviews__bar">
				<p class="reviews__note">
					<img class="reviews__note-icon" src="@img/icons/shield.svg" alt="Проверено" width="30" height="36" loading="lazy">
					Все отзывы проверены и&nbsp;оставлены реальными покупателями
				</p>
				<div class="reviews__nav">
					<button type="button" class="reviews__prev swiper-button-prev icon-prev" aria-label="Предыдущий отзыв"></button>
					<button type="button" class="reviews__next swiper-button-next icon-next" aria-label="Следующий отзыв"></button>
				</div>
			</div>
		</div>
	</div>
</section>
